version: 2
updates:
  # LZY's interpreter has no runtime dependencies, so this covers the
  # development and CI tooling only.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "security"]
    commit-message:
      prefix: "chore"
    groups:
      dev-dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci", "security"]
    commit-message:
      prefix: "ci"
    # One pull request for all action bumps. Ungrouped, three bumps to the
    # same workflow opened three PRs, each running the full 19-job matrix,
    # and each going stale the moment another one merged.
    groups:
      github-actions:
        patterns: ["*"]
