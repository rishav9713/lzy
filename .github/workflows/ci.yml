name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: nothing here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install LZY
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run the test suite
        run: python -m pytest

      - name: Check that the lzy command works
        run: |
          lzy --version
          lzy examples/01-beginner/hello.lzy
          lzy check examples/02-algorithms/fizzbuzz.lzy

      - name: Check that every example still prints what it claims
        run: python tools/record_examples.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: ruff
        run: ruff check --output-format=github .

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Measure coverage
        run: |
          coverage run -m pytest
          coverage report
      - name: Fail if coverage drops below the floor
        run: coverage report --fail-under=90

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && python -m pip install build twine
      - name: Build the distribution
        run: python -m build
      - name: Check the metadata
        run: python -m twine check dist/*
      - name: Check the built version matches lzy.__version__
        run: |
          python - <<'EOF'
          import pathlib, re, sys
          source = pathlib.Path("lzy/__init__.py").read_text(encoding="utf-8")
          expected = re.search(r'__version__ = "([^"]+)"', source).group(1)
          built = sorted(p.name for p in pathlib.Path("dist").glob("*.whl"))
          print("expected", expected, "| built", built)
          if not any(f"-{expected}-" in name for name in built):
              sys.exit(f"built wheel does not carry version {expected}")
          EOF
      - name: Install the built wheel into a clean environment and run it
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/python -m pip install dist/*.whl
          /tmp/fresh/bin/lzy --version
          /tmp/fresh/bin/lzy examples/01-beginner/hello.lzy
      - uses: actions/upload-artifact@v7
        with:
          name: distribution
          path: dist/

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Check that documentation links point at real files
        run: python tools/check_docs.py
