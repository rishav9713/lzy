name: Website

# Builds the LZY website in LZY-Website/ and publishes it to GitHub Pages.
#
# Pull requests build and check the site without publishing it. A push to
# main builds, checks and publishes. The site's data is generated from the
# interpreter in this repository, so the website can never describe a
# different LZY from the one on main. See LZY-Website/docs/deployment.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; the deploy job asks for what it needs.
permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  # Never cancel a deployment half way; do cancel superseded pull request runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and check the website
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: LZY-Website
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install LZY, which the website reads its facts from
        working-directory: .
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: LZY-Website/package-lock.json

      - name: Install the website's dependencies
        run: npm ci

      - name: Read the Pages address
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Type-check and check formatting
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build and prerender every page
        env:
          # From GitHub's own Pages settings, so a custom domain needs no
          # code change. Empty on pull requests, where the defaults apply.
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Check every link, asset and anchor
        run: npm run check:links

      - name: Audit the packages that ship to browsers
        run: npm audit --omit=dev --audit-level=high

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: LZY-Website/dist

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
